name: JARVIS Daily Summary

on:
  # Ejecutar cada 30 minutos entre 7am-12pm y 7pm-11pm (hora Colombia UTC-5)
  # UTC times: 12:00-17:00 y 00:00-04:00
  schedule:
    - cron: '0,30 12-17,0-4 * * *'
  # También permite ejecutarse manualmente desde GitHub Actions tab
  workflow_dispatch:

jobs:
  send-summary:
    runs-on: ubuntu-latest
    name: Enviar resumen de JARVIS
    steps:
      - name: Despertar Render
        run: |
          echo "Despertando Render..."
          curl -s --max-time 90 https://jarvis-h20g.onrender.com/ || true
          echo "Render despierto, esperando..."
          sleep 5
      - name: Llamar endpoint de resumen
        run: |
          echo "Ejecutando resumen de JARVIS..."
          response=$(curl -s --max-time 60 -w "\n%{http_code}" https://jarvis-h20g.onrender.com/api/cron/daily-summary)
          echo "Respuesta: $response"
      - name: Verificar alertas proactivas
        run: |
          echo "Verificando alertas..."
          response=$(curl -s --max-time 60 -w "\n%{http_code}" https://jarvis-h20g.onrender.com/api/cron/alertas)
          echo "Respuesta alertas: $response"
