<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JARVIS - Dashboard Financiero</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0f0f23;
            color: #fff;
            min-height: 100vh;
            padding: 20px;
        }
        .container { max-width: 1400px; margin: 0 auto; }

        /* Header */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px solid #2a2a4e;
        }
        h1 { font-size: 28px; color: #6366f1; }
        .date { color: #8b8b9e; font-size: 14px; }

        /* Grid principal */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        /* Cards */
        .card {
            background: #1a1a2e;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        .card-title {
            font-size: 14px;
            color: #8b8b9e;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .card-value {
            font-size: 32px;
            font-weight: bold;
        }
        .income { color: #10b981; }
        .expense { color: #ef4444; }
        .balance { color: #6366f1; }

        /* Accounts */
        .account-item {
            display: flex;
            align-items: center;
            padding: 12px;
            background: #16213e;
            border-radius: 8px;
            margin-bottom: 10px;
        }
        .account-icon { font-size: 24px; margin-right: 15px; }
        .account-name { flex: 1; }
        .account-balance { font-weight: bold; font-size: 18px; }

        /* Categories chart */
        .chart-container {
            position: relative;
            height: 250px;
        }

        /* Trends chart */
        .chart-container-tall {
            position: relative;
            height: 300px;
        }

        /* Alerts */
        .alert-item {
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .alert-warning { background: #2d2a1f; border-left: 4px solid #f59e0b; }
        .alert-danger { background: #2d1f1f; border-left: 4px solid #ef4444; }
        .alert-success { background: #1f2d1f; border-left: 4px solid #10b981; }

        /* Goals */
        .goal-item { margin-bottom: 15px; }
        .goal-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
        }
        .goal-bar {
            height: 8px;
            background: #2a2a4e;
            border-radius: 4px;
            overflow: hidden;
        }
        .goal-fill {
            height: 100%;
            border-radius: 4px;
            transition: width 0.3s;
        }

        /* Transactions */
        .tx-item {
            display: flex;
            align-items: center;
            padding: 10px;
            border-bottom: 1px solid #2a2a4e;
        }
        .tx-item:last-child { border-bottom: none; }
        .tx-icon { font-size: 20px; margin-right: 12px; }
        .tx-info { flex: 1; }
        .tx-desc { font-size: 14px; }
        .tx-date { font-size: 12px; color: #8b8b9e; }
        .tx-amount { font-weight: bold; font-size: 16px; }

        /* Recurring */
        .recurring-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px;
            background: #16213e;
            border-radius: 8px;
            margin-bottom: 10px;
        }

        /* Full width */
        .full { grid-column: 1 / -1; }

        /* Loading */
        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 200px;
            color: #8b8b9e;
        }

        /* Refresh button */
        .refresh-btn {
            background: #6366f1;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
        }
        .refresh-btn:hover { background: #5558e3; }

        /* Responsive */
        @media (max-width: 768px) {
            .grid { grid-template-columns: 1fr; }
            .card-value { font-size: 24px; }
        }

        /* Pronóstico */
        .pronostico-card {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            border: 1px solid #6366f1;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
        }
        .pronostico-title { font-size: 14px; color: #8b8b9e; text-transform: uppercase; }
        .pronostico-value { font-size: 28px; font-weight: bold; color: #6366f1; margin: 8px 0; }
        .pronostico-msg { font-size: 13px; color: #aaa; }
        .tendencia-badge { padding: 4px 10px; border-radius: 20px; font-size: 12px; }
        .tendencia-alza { background: #2d1f1f; color: #ef4444; }
        .tendencia-baja { background: #1f2d1f; color: #10b981; }
        .tendencia-estable { background: #2d2a1f; color: #f59e0b; }

        /* PDF button */
        .pdf-btn {
            background: #10b981;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            text-decoration: none;
        }
        .pdf-btn:hover { background: #059669; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div>
                <h1>🤖 JARVIS Dashboard</h1>
                <p class="date" id="currentDate"></p>
            </div>
            <div>
                <button class="pdf-btn" onclick="window.open(`${BASE_URL}/api/kebo/export-pdf?usuario_id=${usuario}`, '_blank')">📄 Generar Reporte</button>
                <button class="refresh-btn" onclick="loadData()">🔄 Actualizar</button>
            </div>
        </header>

        <!-- Pronóstico de gastos -->
        <div class="pronostico-card" id="pronosticoCard" style="display:none">
            <span class="pronostico-title">🔮 Pronóstico de gastos este mes</span>
            <div class="pronostico-value" id="pronosticoValue">$0</div>
            <div class="pronostico-msg" id="pronosticoMsg"></div>
        </div>

        <!-- Resumen Cards -->
        <div class="grid">
            <div class="card">
                <div class="card-header">
                    <span class="card-title">💰 Balance</span>
                </div>
                <div class="card-value balance" id="balance">$0</div>
            </div>
            <div class="card">
                <div class="card-header">
                    <span class="card-title">📈 Ingresos</span>
                </div>
                <div class="card-value income" id="ingresos">$0</div>
            </div>
            <div class="card">
                <div class="card-header">
                    <span class="card-title">📉 Gastos</span>
                </div>
                <div class="card-value expense" id="gastos">$0</div>
            </div>
            <div class="card">
                <div class="card-header">
                    <span class="card-title">📊 Presupuesto</span>
                </div>
                <div class="card-value" id="presupuesto">0%</div>
                <div style="height: 8px; background: #2a2a4e; border-radius: 4px; margin-top: 10px;">
                    <div id="presupuestoBar" style="height: 100%; border-radius: 4px; width: 0%;"></div>
                </div>
            </div>
        </div>

        <div class="grid">
            <!-- Cuentas -->
            <div class="card">
                <div class="card-header">
                    <span class="card-title">💳 Cuentas</span>
                </div>
                <div id="cuentasList">
                    <div class="loading">Cargando...</div>
                </div>
            </div>

            <!-- Distribución Gastos -->
            <div class="card">
                <div class="card-header">
                    <span class="card-title">🍕 Gastos por Categoría</span>
                </div>
                <div class="chart-container">
                    <canvas id="categoryChart"></canvas>
                </div>
            </div>

            <!-- Alertas -->
            <div class="card">
                <div class="card-header">
                    <span class="card-title">⚠️ Alertas</span>
                </div>
                <div id="alertasList">
                    <div class="loading">Cargando...</div>
                </div>
            </div>

            <!-- Tendencia -->
            <div class="card full">
                <div class="card-header">
                    <span class="card-title">📈 Tendencia 6 Meses</span>
                </div>
                <div class="chart-container-tall">
                    <canvas id="trendChart"></canvas>
                </div>
            </div>
        </div>

        <div class="grid">
            <!-- Metas -->
            <div class="card">
                <div class="card-header">
                    <span class="card-title">🎯 Metas de Ahorro</span>
                </div>
                <div id="metasList">
                    <div class="loading">Cargando...</div>
                </div>
            </div>

            <!-- Recurrentes -->
            <div class="card">
                <div class="card-header">
                    <span class="card-title">🔁 Pagos Recurrentes</span>
                </div>
                <div id="recurrentesList">
                    <div class="loading">Cargando...</div>
                </div>
            </div>

            <!-- Últimas Transacciones -->
            <div class="card full">
                <div class="card-header">
                    <span class="card-title">📋 Últimas Transacciones</span>
                </div>
                <div id="transaccionesList">
                    <div class="loading">Cargando...</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const BASE_URL = 'https://jarvis-h20g.onrender.com';
        const usuario = 'iphone_user';

        let categoryChart = null;
        let trendChart = null;

        // Formatear pesos
        function formatMoney(num) {
            return '$' + Number(num || 0).toLocaleString('es-CO');
        }

        // Cargar todos los datos
        async function loadData() {
            const promises = [
                fetch(`${BASE_URL}/api/finanzas/resumen?usuario_id=${usuario}`).then(r => r.json()),
                fetch(`${BASE_URL}/api/kebo/cuentas?usuario_id=${usuario}`).then(r => r.json()),
                fetch(`${BASE_URL}/api/kebo/alertas?usuario_id=${usuario}`).then(r => r.json()),
                fetch(`${BASE_URL}/api/kebo/metas?usuario_id=${usuario}`).then(r => r.json()),
                fetch(`${BASE_URL}/api/kebo/recurrentes?usuario_id=${usuario}`).then(r => r.json()),
                fetch(`${BASE_URL}/api/kebo/transacciones?usuario_id=${usuario}&limite=15`).then(r => r.json()),
                fetch(`${BASE_URL}/api/kebo/estadisticas?usuario_id=${usuario}&meses=6`).then(r => r.json()),
                fetch(`${BASE_URL}/api/kebo/pronostico?usuario_id=${usuario}`).then(r => r.json())
            ];

            try {
                const [resumen, cuentas, alertas, metas, recurrentes, transacciones, stats, pronostico] = await Promise.all(promises);
                updateResumen(resumen);
                updateCuentas(cuentas);
                updateAlertas(alertas);
                updateMetas(metas);
                updateRecurrentes(recurrentes);
                updateTransacciones(transacciones);
                updateCharts(resumen, stats);
                updatePronostico(pronostico);
            } catch(e) {
                console.error('Error cargando datos:', e);
                alert('Error al cargar datos. Revisa la consola.');
            }
        }

        function updateResumen(data) {
            if (data.error) return;
            document.getElementById('balance').textContent = formatMoney(data.balance);
            document.getElementById('ingresos').textContent = formatMoney(data.ingresos);
            document.getElementById('gastos').textContent = formatMoney(data.gastos);

            const pct = data.porcentaje_uso || 0;
            document.getElementById('presupuesto').textContent = pct + '%';
            const bar = document.getElementById('presupuestoBar');
            bar.style.width = Math.min(pct, 100) + '%';
            bar.style.background = pct > 90 ? '#ef4444' : pct > 70 ? '#f59e0b' : '#10b981';
        }

        function updateCuentas(data) {
            const container = document.getElementById('cuentasList');
            if (!data.cuentas || data.cuentas.length === 0) {
                container.innerHTML = '<p style="color:#8b8b9e">Sin cuentas registradas</p>';
                return;
            }
            container.innerHTML = data.cuentas.map(c => `
                <div class="account-item">
                    <span class="account-icon">${c.icono || '💳'}</span>
                    <span class="account-name">${c.nombre}</span>
                    <span class="account-balance" style="color: ${c.balance >= 0 ? '#10b981' : '#ef4444'}">${formatMoney(c.balance)}</span>
                </div>
            `).join('');
        }

        function updateAlertas(data) {
            const container = document.getElementById('alertasList');
            if (!data.alertas || data.alertas.length === 0) {
                container.innerHTML = '<p style="color:#10b981">✅ Sin alertas. Todo va bien.</p>';
                return;
            }
            container.innerHTML = data.alertas.map(a => `
                <div class="alert-item ${a.tipo === 'excedido' ? 'alert-danger' : 'alert-warning'}">
                    <span>${a.tipo === 'excedido' ? '🚨' : '⚠️'}</span>
                    <span>${a.mensaje}</span>
                </div>
            `).join('');
        }

        function updateMetas(data) {
            const container = document.getElementById('metasList');
            if (!data.metas || data.metas.length === 0) {
                container.innerHTML = '<p style="color:#8b8b9e">Sin metas de ahorro</p>';
                return;
            }
            container.innerHTML = data.metas.map(m => {
                const pct = m.porcentaje || 0;
                const color = pct >= 100 ? '#10b981' : '#6366f1';
                return `
                <div class="goal-item">
                    <div class="goal-header">
                        <span>${m.nombre}</span>
                        <span>${formatMoney(m.current_amount)} / ${formatMoney(m.monto_objetivo)}</span>
                    </div>
                    <div class="goal-bar">
                        <div class="goal-fill" style="width: ${Math.min(pct, 100)}%; background: ${color}"></div>
                    </div>
                </div>
            `}).join('');
        }

        function updateRecurrentes(data) {
            const container = document.getElementById('recurrentesList');
            if (!data.recurrentes || data.recurrentes.length === 0) {
                container.innerHTML = '<p style="color:#8b8b9e">Sin pagos recurrentes</p>';
                return;
            }
            container.innerHTML = data.recurrentes.map(r => `
                <div class="recurring-item">
                    <span>📅 ${r.nombre}</span>
                    <span style="color:#ef4444">${formatMoney(r.monto)} / día ${r.dia}</span>
                </div>
            `).join('');
        }

        function updateTransacciones(data) {
            const container = document.getElementById('transaccionesList');
            if (!data.transacciones || data.transacciones.length === 0) {
                container.innerHTML = '<p style="color:#8b8b9e">Sin transacciones</p>';
                return;
            }
            container.innerHTML = data.transacciones.slice(0, 10).map(t => {
                const emoji = t.tipo === 'expense' ? '💸' : t.tipo === 'income' ? '💰' : '🔄';
                const color = t.tipo === 'expense' ? '#ef4444' : '#10b981';
                const signo = t.tipo === 'expense' ? '-' : '+';
                return `
                <div class="tx-item">
                    <span class="tx-icon">${emoji}</span>
                    <div class="tx-info">
                        <div class="tx-desc">${t.descripcion || t.tipo}</div>
                        <div class="tx-date">${t.fecha || ''}</div>
                    </div>
                    <span class="tx-amount" style="color: ${color}">${signo}${formatMoney(t.monto)}</span>
                </div>
            `}).join('');
        }

        function updatePronostico(data) {
            if (data.error || !data.pronostico_mensual) return;
            const card = document.getElementById('pronosticoCard');
            card.style.display = 'block';
            document.getElementById('pronosticoValue').textContent = formatMoney(data.pronostico_mensual);
            const tendenciaClass = data.tendencia.includes('Al alza') ? 'tendencia-alza' :
                                    data.tendencia.includes('A la baja') ? 'tendencia-baja' : 'tendencia-estable';
            document.getElementById('pronosticoMsg').innerHTML =
                `${data.mensaje}<br><span class="tendencia-badge ${tendenciaClass}">${data.tendencia} (${data.cambio_vs_mes_anterior_pct}%)</span>`;
        }

        function updateCharts(resumen, stats) {
            // Chart 1: Distribución por categoría
            const ctx1 = document.getElementById('categoryChart').getContext('2d');
            if (categoryChart) categoryChart.destroy();

            const categorias = resumen.datos_por_categoria || [];
            if (categorias.length > 0) {
                categoryChart = new Chart(ctx1, {
                    type: 'doughnut',
                    data: {
                        labels: categorias.map(c => c.categoria),
                        datasets: [{
                            data: categorias.map(c => c.gastado),
                            backgroundColor: [
                                '#6366f1', '#8b5cf6', '#ec4899', '#f59e0b', '#10b981',
                                '#06b6d4', '#3b82f6', '#ef4444', '#84cc16', '#a855f7'
                            ]
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            legend: {
                                position: 'right',
                                labels: { color: '#fff', font: { size: 11 } }
                            }
                        }
                    }
                });
            }

            // Chart 2: Tendencia mensual con ahorro como línea
            const ctx2 = document.getElementById('trendChart').getContext('2d');
            if (trendChart) trendChart.destroy();

            const tendencia = stats.tendencia || [];
            if (tendencia.length > 0) {
                trendChart = new Chart(ctx2, {
                    type: 'bar',
                    data: {
                        labels: tendencia.map(t => t.mes),
                        datasets: [
                            {
                                type: 'bar',
                                label: 'Ingresos',
                                data: tendencia.map(t => t.ingresos),
                                backgroundColor: '#10b981',
                                borderRadius: 4
                            },
                            {
                                type: 'bar',
                                label: 'Gastos',
                                data: tendencia.map(t => t.gastos),
                                backgroundColor: '#ef4444',
                                borderRadius: 4
                            },
                            {
                                type: 'line',
                                label: 'Ahorro',
                                data: tendencia.map(t => t.balance),
                                borderColor: '#6366f1',
                                backgroundColor: 'rgba(99,102,241,0.2)',
                                fill: true,
                                tension: 0.3,
                                pointBackgroundColor: '#6366f1',
                                pointRadius: 5,
                                yAxisID: 'y2'
                            }
                        ]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        scales: {
                            x: { ticks: { color: '#8b8b9e' }, grid: { color: '#2a2a4e' } },
                            y: {
                                ticks: { color: '#8b8b9e', callback: v => '$' + (v/1000000).toFixed(1) + 'M' },
                                grid: { color: '#2a2a4e' },
                                stacked: false
                            },
                            y2: {
                                position: 'right',
                                ticks: { color: '#6366f1', callback: v => '$' + (v/1000000).toFixed(1) + 'M' },
                                grid: { display: false },
                                title: { display: true, text: 'Ahorro', color: '#6366f1' }
                            }
                        },
                        plugins: {
                            legend: { labels: { color: '#fff' } },
                            tooltip: {
                                callbacks: {
                                    label: ctx => `${ctx.dataset.label}: $${(ctx.raw/1000).toFixed(0)}K`
                                }
                            }
                        }
                    }
                });
            }
        }

        // Fecha actual
        const now = new Date();
        document.getElementById('currentDate').textContent = now.toLocaleDateString('es-ES', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });

        // Cargar al iniciar
        loadData();
    </script>
</body>
</html>
