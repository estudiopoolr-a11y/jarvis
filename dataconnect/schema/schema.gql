# Firebase Data Connect — esquema relacional de JARVIS
# Equivalente SQL (PostgreSQL) del modelo documental Kebo en Cloud Firestore.
# Un presupuesto es un techo mensual: nunca se resta de accounts.balance.

type User @table(name: "users", key: "id") {
  id: String!
  nombre: String!
  moneda: String! @default(expr: "'COP'")
  tema: String! @default(expr: "'dark'")
  createdAt: Timestamp! @default(expr: "request.time")
}

type Account @table(name: "accounts", key: "id") {
  id: UUID! @default(expr: "uuidV4()")
  user: User!
  nombre: String!
  type: String! @default(expr: "'cash'")
  currency: String! @default(expr: "'COP'")
  institution: String @default(expr: "''")
  bankLast4: String @default(expr: "''") @col(name: "bank_last4")
  balance: Float! @default(expr: "0")
  icon: String @default(expr: "'💰'")
  color: String @default(expr: "'#10b981'")
  createdAt: Timestamp! @default(expr: "request.time")
}

type Category @table(name: "categories", key: "id") {
  id: UUID! @default(expr: "uuidV4()")
  user: User!
  nombre: String!
  budget: Float! @default(expr: "0")
  tipo: String! @default(expr: "'variable'")
  icono: String @default(expr: "'📦'")
  color: String @default(expr: "'#3b82f6'")
  createdAt: Timestamp! @default(expr: "request.time")
}

type Subcategory @table(name: "subcategories", key: "id") {
  id: UUID! @default(expr: "uuidV4()")
  category: Category!
  nombre: String!
  icono: String @default(expr: "'📦'")
  color: String @default(expr: "'#6b7280'")
  createdAt: Timestamp! @default(expr: "request.time")
}

type BudgetItem @table(name: "budget_items", key: "id") {
  id: UUID! @default(expr: "uuidV4()")
  user: User!
  category: Category
  categoryName: String! @col(name: "category_name")
  amount: Float!
  period: String!
  year: String!
  month: String!
  rolloverFrom: String @col(name: "rollover_from")
  rolloverAmount: Float @col(name: "rollover_amount")
  createdAt: Timestamp! @default(expr: "request.time")
}

type Transaction @table(name: "transactions", key: "id") {
  id: UUID! @default(expr: "uuidV4()")
  user: User!
  account: Account
  category: Category
  toAccount: Account @col(name: "to_account_id")
  parent: Transaction
  recurring: Recurring
  type: String!
  amount: Float!
  payee: String @default(expr: "''")
  description: String @default(expr: "''")
  fee: Float! @default(expr: "0")
  status: String! @default(expr: "'cleared'")
  tags: [String!]
  date: Date!
  period: String!
  isSplit: Boolean! @default(expr: "false") @col(name: "is_split")
  isSplitChild: Boolean! @default(expr: "false") @col(name: "is_split_child")
  createdAt: Timestamp! @default(expr: "request.time")
}

type TransactionSplit @table(name: "transaction_splits", key: "id") {
  id: UUID! @default(expr: "uuidV4()")
  transaction: Transaction!
  categoryName: String! @col(name: "category_name")
  amount: Float!
}

type Goal @table(name: "goals", key: "id") {
  id: UUID! @default(expr: "uuidV4()")
  user: User!
  account: Account
  nombre: String!
  montoObjetivo: Float! @col(name: "monto_objetivo")
  currentAmount: Float! @default(expr: "0") @col(name: "current_amount")
  fechaLimite: String @default(expr: "''") @col(name: "fecha_limite")
  completada: Boolean! @default(expr: "false")
  createdAt: Timestamp! @default(expr: "request.time")
}

type GoalContribution @table(name: "goal_contributions", key: "id") {
  id: UUID! @default(expr: "uuidV4()")
  goal: Goal!
  monto: Float!
  fecha: Date!
  createdAt: Timestamp! @default(expr: "request.time")
}

type Recurring @table(name: "recurring", key: "id") {
  id: UUID! @default(expr: "uuidV4()")
  user: User!
  account: Account
  category: Category
  nombre: String!
  monto: Float!
  frecuencia: String! @default(expr: "'monthly'")
  dia: Int!
  activo: Boolean! @default(expr: "true")
  ultimaEjecucion: Timestamp @col(name: "ultima_ejecucion")
  createdAt: Timestamp! @default(expr: "request.time")
}

type Reminder @table(name: "reminders", key: "id") {
  id: UUID! @default(expr: "uuidV4()")
  user: User!
  text: String!
  day: Int!
  month: String!
  year: String!
  categoria: String @default(expr: "''")
  monto: Float! @default(expr: "0")
  done: Boolean! @default(expr: "false")
  notifiedAt: Timestamp @col(name: "notified_at")
  doneAt: Timestamp @col(name: "done_at")
  createdAt: Timestamp! @default(expr: "request.time")
}

type Loan @table(name: "loans", key: "id") {
  id: UUID! @default(expr: "uuidV4()")
  user: User!
  persona: String!
  monto: Float!
  montoOriginal: Float! @col(name: "monto_original")
  montoPagado: Float! @default(expr: "0") @col(name: "monto_pagado")
  montoPendiente: Float! @col(name: "monto_pendiente")
  fecha: Date!
  nota: String @default(expr: "''")
  status: String! @default(expr: "'pendiente'")
  createdAt: Timestamp! @default(expr: "request.time")
  updatedAt: Timestamp! @default(expr: "request.time")
}

type LoanPayment @table(name: "loan_payments", key: "id") {
  id: UUID! @default(expr: "uuidV4()")
  loan: Loan!
  monto: Float!
  fecha: Date!
}

type ScheduledTransaction @table(name: "scheduled_transactions", key: "id") {
  id: UUID! @default(expr: "uuidV4()")
  user: User!
  account: Account
  category: Category
  type: String!
  amount: Float!
  categoriaNombre: String! @col(name: "categoria_nombre")
  cuentaNombre: String! @col(name: "cuenta_nombre")
  payee: String @default(expr: "''")
  description: String @default(expr: "''")
  scheduledDate: Date! @col(name: "scheduled_date")
  status: String! @default(expr: "'pending'")
  tags: [String!]
  executedAt: Timestamp @col(name: "executed_at")
  txId: UUID @col(name: "tx_id")
  createdAt: Timestamp! @default(expr: "request.time")
}

type ExchangeRate @table(name: "exchange_rates", key: "id") {
  id: UUID! @default(expr: "uuidV4()")
  user: User!
  currency: String!
  rate: Float!
  updatedAt: Timestamp! @default(expr: "request.time")
}

type Task @table(name: "tasks", key: "id") {
  id: UUID! @default(expr: "uuidV4()")
  user: User!
  tarea: String!
  prioridad: String! @default(expr: "'Media'")
  fechaLimite: String @default(expr: "'Pronto'") @col(name: "fecha_limite")
  completada: Boolean! @default(expr: "false")
  createdAt: Timestamp! @default(expr: "request.time")
}

type FixedPayment @table(name: "fixed_payments", key: "id") {
  id: String!
  user: User!
  nombre: String!
  monto: Float!
  diaMes: Int! @col(name: "dia_mes")
  categoria: String! @default(expr: "'General'")
  activo: Boolean! @default(expr: "true")
  createdAt: Timestamp! @default(expr: "request.time")
}

type Profile @table(name: "profiles", key: "user") {
  user: User!
  datos: String! @default(expr: "'{}'")
}

type ChatMessage @table(name: "chat_messages", key: "id") {
  id: UUID! @default(expr: "uuidV4()")
  user: User!
  remitente: String!
  mensaje: String!
  createdAt: Timestamp! @default(expr: "request.time")
}

type LegacyBudget @table(name: "legacy_budgets", key: "id") {
  id: String!
  user: User!
  categoria: String!
  limite: Float!
  updatedAt: Timestamp @default(expr: "request.time")
}

type LegacyTransaction @table(name: "legacy_transactions", key: "id") {
  id: UUID! @default(expr: "uuidV4()")
  user: User!
  tipo: String!
  monto: Float!
  categoria: String!
  descripcion: String @default(expr: "''")
  mes: String
  createdAt: Timestamp! @default(expr: "request.time")
}
