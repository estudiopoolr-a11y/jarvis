services:
  openclaw-gateway:
    image: ghcr.io/openclaw/openclaw:latest
    container_name: jarvis_openclaw_core
    restart: unless-stopped
    init: true
    command:
      - node
      - dist/index.js
      - gateway
      - --bind
      - lan
      - --port
      - "18789"
    ports:
      - "127.0.0.1:${OPENCLAW_HOST_PORT:-18789}:18789"
    environment:
      HOME: /home/node
      OPENCLAW_HOME: /home/node
      OPENCLAW_STATE_DIR: /home/node/.openclaw
      OPENCLAW_CONFIG_DIR: /home/node/.openclaw
      OPENCLAW_CONFIG_PATH: /home/node/.openclaw/openclaw.json
      OPENCLAW_WORKSPACE_DIR: /home/node/.openclaw/workspace
      OPENCLAW_GATEWAY_PORT: "18789"
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN:?Set OPENCLAW_GATEWAY_TOKEN in .env}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      FIREBASE_DATABASE_URL: ${FIREBASE_DATABASE_URL:-}
      FIREBASE_CREDENTIALS: ${FIREBASE_CREDENTIALS:-}
      NOTION_API_KEY: ${NOTION_API_KEY:-}
      NOTION_FINANZAS_DB_ID: ${NOTION_FINANZAS_DB_ID:-}
    volumes:
      - ./openclaw_config:/home/node/.openclaw
      - ./data:/home/node/.openclaw/workspace
    cap_drop:
      - NET_ADMIN
      - NET_RAW
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - node
        - dist/docker-healthcheck.js
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
